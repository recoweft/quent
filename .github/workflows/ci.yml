name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workspace:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - name: Workspace DB-free regression tests
        run: cargo test --workspace --locked
      - name: All-feature DB-free tests (live_ runs in required live-databases job)
        run: cargo test --workspace --all-features --locked -- --skip live_
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo tree -p quent-core --locked
  adapters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["postgres,runtime-tokio,tls-rustls", "mysql,runtime-tokio,tls-rustls"]
    steps:
      - uses: actions/checkout@v4
      - run: cargo check -p quent --no-default-features --features "${{ matrix.features }}" --locked
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-features.sh
  live-databases:
    name: Required PostgreSQL and MySQL dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production dispatcher on digest-pinned disposable DBs (no env skip)
        run: bash scripts/test-dispatch.sh
