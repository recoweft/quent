name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workspace:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - name: Workspace DB-free regression tests
        run: cargo test --workspace --locked
      - name: All-feature DB-free tests (live_ runs in required live-databases job)
        run: cargo test --workspace --all-features --locked -- --skip live_
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo tree -p quent-core --locked
  adapters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["postgres,runtime-tokio,tls-rustls", "mysql,runtime-tokio,tls-rustls"]
    steps:
      - uses: actions/checkout@v4
      - run: cargo check -p quent --no-default-features --features "${{ matrix.features }}" --locked
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-features.sh
  output-features:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: ["local-details", "output-tracing", "local-details,output-tracing", "manifest", "manifest,local-details", "manifest,output-tracing", "manifest,local-details,output-tracing", "operation-spec", "operation-spec,manifest", "operation-spec,local-details", "operation-spec,output-tracing", "operation-spec,manifest,local-details,output-tracing", "codegen", "codegen,local-details", "codegen,output-tracing", "codegen,local-details,output-tracing", "review", "review,local-details", "review,output-tracing", "review,local-details,output-tracing", "source-review", "source-review,review", "source-review,local-details", "source-review,output-tracing", "source-review,local-details,output-tracing", "review-ci", "review-ci,source-review", "review-ci,output-tracing", "review-ci,local-details", "review-ci,codegen", "mcp", "mcp,local-details", "mcp,output-tracing", "mcp,review-ci,source-review"]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked dependencies for standalone generated consumer controls
        if: contains(matrix.features, 'codegen')
        run: cargo fetch --locked
      - run: cargo test -p quent --no-default-features --features "${{ matrix.features }}" --locked
      - run: cargo clippy -p quent --all-targets --no-default-features --features "${{ matrix.features }}" --locked -- -D warnings
  review-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: ["review", "review,manifest", "source-review", "source-review,review", "source-review,manifest", "review-ci", "review-ci,source-review", "review-ci,manifest", "mcp", "mcp,review-ci,source-review"]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p quent-cli --no-default-features --features "${{ matrix.features }}" --locked
      - run: cargo clippy -p quent-cli --all-targets --no-default-features --features "${{ matrix.features }}" --locked -- -D warnings
  live-databases:
    name: Required PostgreSQL and MySQL dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile complete regression before the disposable DB lifetime
        run: cargo test --workspace --all-features --locked --no-run
      - name: Production dispatcher and catalog/CLI on digest-pinned disposable DBs (no env skip)
        run: bash scripts/test-dispatch.sh cargo test --workspace --all-features --locked -- --test-threads=1
