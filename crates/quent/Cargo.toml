[package]
name = "quent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
quent-core.workspace = true
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"], optional = true }

[features]
default = []
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
runtime-tokio = ["dep:futures-util", "dep:tokio", "tokio/rt", "sqlx?/runtime-tokio"]
tls-rustls = ["sqlx?/tls-rustls-ring-webpki"]

[dev-dependencies]
# Test-only bounded fixture parsing; versions already pinned transitively in PR1.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
